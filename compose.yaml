services:

  minio:
    image: minio/minio
    container_name: glia-minio

    command: server /data --console-address ":9001"

    ports:
      - "9010:9000"
      - "9011:9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

    volumes:
      - minio_data:/data

  pipeline:
    build: .
    shm_size: "256m"

    container_name: glia-pipeline

    entrypoint: ["python", "-m", "src.main"]
    command: ["inference"]

    depends_on:
      minio:
        condition: service_healthy

    environment:
      HMAC_SECRET: ${HMAC_SECRET}

      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}

    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - ./config:/app/config:ro
      - ./mlruns:/app/mlruns

volumes:
  minio_data:
