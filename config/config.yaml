paths:
  dicom: "data/DICOMs"
  masks: "data/masks"
  metadata_db: "output/metadata.db"
  predictions: "data/inference_out/predictions"
  overlays: "data/inference_out/overlays"

etl:
  num_workers: 4

preprocessing:
  image_size: 256
  val_split: 0.2
  context_slices: 1          # 2.5D: num adjacent slices per side (1 = 3-channel total)

training:
  segment_number: null      # Set explicitly if DICOM SEG contains multiple segments
  batch_size: 16
  learning_rate: 0.001       # Adam update size, e.g. 0.0001 or 0.004
  weight_decay: 0.00001
  lr_scheduler:
    factor: 0.5
    patience: 5
  epochs: 36
  num_workers: 4
  pin_memory: true
  gradient_accumulation_steps: 2  # Number of batches per optimizer update
  mixed_precision: true
  seed: 74

augmentation:
  horizontal_flip_p: 0.474
  vertical_flip_p: 0.645
  rotate_90_p: 0.5
  shift_scale_rotate:
    shift_limit: 0.05
    scale_limit: 0.1
    rotate_limit: 15
    p: 0.5
  brightness_contrast:
    brightness_limit: 0.2
    contrast_limit: 0.2
    p: 0.3
  gaussian_blur:
    blur_limit: [3, 5]
    p: 0.2

model:
  in_channels: 3              # 2.5D: 2*context_slices + 1
  out_channels: 1
  features: [32, 64, 128, 256]

inference:
  batch_size: 24
  num_workers: 2
  threshold: 0.5
  checkpoint: "data/model_chkpth/best.pth"

logging:
  level: "INFO"

mlflow:
  experiment_name: "2DSeg"
  tracking_uri: "./mlruns"
